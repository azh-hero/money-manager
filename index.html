<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-neutral-50 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-sm bg-white border border-neutral-200 rounded-xl p-8 shadow-sm">

    <div class="flex items-center justify-center gap-2.5 mb-8">
      <div class="bg-neutral-900 rounded-[10px] p-2.5">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2"/>
          <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
        </svg>
      </div>
      <span class="text-lg font-semibold text-neutral-950">Money Manager</span>
    </div>

    <h1 class="text-2xl font-bold text-neutral-950 text-center">Tes koneksi</h1>
    <p class="text-sm text-neutral-500 text-center mt-1.5">
      Halaman ini hanya untuk memastikan aplikasi tersambung ke database.
    </p>

    <div id="status" class="mt-7 rounded-[10px] border border-neutral-200 bg-neutral-100 px-4 py-3.5">
      <p class="text-sm font-medium text-neutral-950">Memeriksa…</p>
    </div>

  </div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  // ====== GANTI DUA BARIS DI BAWAH INI ======
  const SUPABASE_URL = 'https://dguvsoxvkguougpewddf.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_4IlNLlfWVMawXoub1ZZb8A_bd-Nl_Sg'
  // ==========================================

  const box = document.getElementById('status')

  function show(ok, judul, pesan) {
    box.className = ok
      ? 'mt-7 rounded-[10px] border border-green-200 bg-green-50 px-4 py-3.5'
      : 'mt-7 rounded-[10px] border border-red-200 bg-red-50 px-4 py-3.5'
    box.innerHTML =
      '<p class="text-sm font-semibold ' + (ok ? 'text-green-700' : 'text-red-700') + '">' + judul + '</p>' +
      '<p class="text-xs mt-1 ' + (ok ? 'text-green-700' : 'text-red-700') + '">' + pesan + '</p>'
  }

  try {
    if (SUPABASE_URL.startsWith('TEMPEL') || SUPABASE_ANON_KEY.startsWith('TEMPEL')) {
      show(false, 'Kunci belum diisi', 'Project URL dan anon key masih berupa teks contoh.')
    } else {
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      const { error } = await supabase.from('profiles').select('id').limit(1)

      if (error && error.message.toLowerCase().includes('fetch')) {
        show(false, 'Gagal tersambung', 'Periksa kembali Project URL.')
      } else if (error && error.code === '42P01') {
        show(false, 'Tabel tidak ditemukan', 'Skema SQL sepertinya belum dijalankan.')
      } else if (error) {
        show(false, 'Ada masalah', error.message)
      } else {
        show(true, 'Berhasil tersambung', 'Database sudah siap. Lanjut ke tahap berikutnya.')
      }
    }
  } catch (e) {
    show(false, 'Ada masalah', e.message)
  }
</script>

</body>
</html>
