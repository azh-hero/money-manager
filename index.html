<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Money Manager</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#171717">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Money Manager">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    input:focus { outline: 2px solid #A1A1A1; outline-offset: 1px; }
  </style>
</head>
<body class="bg-neutral-50 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-sm bg-white border border-neutral-200 rounded-xl p-8 shadow-sm">

    <!-- Brand -->
    <div class="flex items-center justify-center gap-2.5">
      <div class="bg-neutral-900 rounded-[10px] p-2.5">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#FAFAFA" clip-rule="evenodd" fill-rule="evenodd"><path d="m21.25 5.5c0 .015 0 .031.002.046.011.243.115.402.241.507.134.122.312.197.507.197 0 0 .75-.043.75-.75 0-2.347-1.903-4.25-4.25-4.25-3.824 0-9.886 0-13.5 0-2.071 0-3.75 1.679-3.75 3.75s1.679 3.75 3.75 3.75h12c.414 0 .75-.336.75-.75s-.336-.75-.75-.75h-12c-1.243 0-2.25-1.007-2.25-2.25s1.007-2.25 2.25-2.25h13.5c1.519 0 2.75 1.231 2.75 2.75z"/><path d="m2.75 5c0-.414-.336-.75-.75-.75s-.75.336-.75.75v14c0 2.071 1.679 3.75 3.75 3.75h14c2.071 0 3.75-1.679 3.75-3.75v-8c0-2.071-1.679-3.75-3.75-3.75h-14c-1.243 0-2.25-1.007-2.25-2.25zm15.25 8.5c.828 0 1.5.672 1.5 1.5s-.672 1.5-1.5 1.5-1.5-.672-1.5-1.5.672-1.5 1.5-1.5z"/><path d="m6 5.75h12c.414 0 .75-.336.75-.75s-.336-.75-.75-.75h-12c-.414 0-.75.336-.75.75s.336.75.75.75z"/></svg>
      </div>
      <span class="text-lg font-semibold text-neutral-950">Money Manager</span>
    </div>

    <!-- Judul -->
    <div class="mt-9 text-center">
      <h1 class="text-2xl font-bold text-neutral-950">Masuk ke akun</h1>
      <p class="text-sm text-neutral-500 mt-1.5">Masukkan username dan password untuk melanjutkan.</p>
    </div>

    <!-- Pesan error -->
    <div id="pesanError" class="hidden mt-6 rounded-[10px] border border-red-200 bg-red-50 px-4 py-3">
      <p id="pesanErrorTeks" class="text-sm text-red-700"></p>
    </div>

    <!-- Form -->
    <div class="mt-7 space-y-4">

      <div class="space-y-2">
        <label for="identitas" class="block text-sm font-medium text-neutral-950">Username</label>
        <input id="identitas" type="text" autocomplete="username"
          placeholder="nama pengguna atau email"
          class="w-full rounded-lg border border-neutral-200 px-3.5 py-3 text-[15px] text-neutral-950 placeholder:text-neutral-400">
      </div>

      <div class="space-y-2">
        <label for="password" class="block text-sm font-medium text-neutral-950">Password</label>
        <div class="relative">
          <input id="password" type="password" autocomplete="current-password"
            placeholder="••••••••"
            class="w-full rounded-lg border border-neutral-200 px-3.5 py-3 pr-11 text-[15px] text-neutral-950 placeholder:text-neutral-400">
          <button type="button" id="tombolMata"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-500"
            aria-label="Tampilkan password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button id="tombolLogin"
        class="w-full rounded-lg bg-neutral-900 py-3.5 text-[15px] font-medium text-neutral-50 disabled:opacity-50">
        Login
      </button>

    </div>

    <!-- Catatan sesi -->
    <div class="mt-5 rounded-[10px] bg-neutral-100 px-3.5 py-3">
      <p class="text-[13px] font-medium text-neutral-950">Sesi login aktif selama 30 hari.</p>
      <p class="text-[13px] text-neutral-500">Maksimal 2 perangkat aktif per akun.</p>
    </div>

  </div>

<script type="module">
  import { majuSplash, tutupSplash } from './splash.js'
import { supabase, deviceLabel } from './config.js'

  const inputIdentitas = document.getElementById('identitas')
  const inputPassword  = document.getElementById('password')
  const tombolLogin    = document.getElementById('tombolLogin')
  const tombolMata     = document.getElementById('tombolMata')
  const kotakError     = document.getElementById('pesanError')
  const teksError      = document.getElementById('pesanErrorTeks')

  majuSplash(55, 'Memeriksa sesi login')
  // Kalau sudah login, langsung masuk
  const { data: { session } } = await supabase.auth.getSession()
  if (session) { majuSplash(100, 'Mengalihkan'); window.location.replace('app.html') }
  else tutupSplash()

  function tampilkanError(pesan) {
    teksError.textContent = pesan
    kotakError.classList.remove('hidden')
  }
  function sembunyikanError() {
    kotakError.classList.add('hidden')
  }

  tombolMata.addEventListener('click', () => {
    inputPassword.type = inputPassword.type === 'password' ? 'text' : 'password'
  })

  async function login() {
    sembunyikanError()
    const identitas = inputIdentitas.value.trim()
    const password  = inputPassword.value

    if (!identitas || !password) {
      tampilkanError('Username dan password wajib diisi.')
      return
    }

    tombolLogin.disabled = true
    tombolLogin.textContent = 'Memproses…'

    try {
      // Kalau yang diketik bukan email, cari dulu emailnya lewat username
      let email = identitas
      if (!identitas.includes('@')) {
        const { data, error } = await supabase.rpc('email_for_username', { p_username: identitas })
        if (error || !data) {
          tampilkanError('Username atau password salah.')
          return
        }
        email = data
      }

      const { error } = await supabase.auth.signInWithPassword({ email, password })
      if (error) {
        tampilkanError('Username atau password salah.')
        return
      }

      // Catat perangkat — sesi terlama otomatis dikeluarkan bila lebih dari 2
      await supabase.rpc('register_session', { p_device_label: deviceLabel() })

      window.location.replace('app.html')

    } catch (e) {
      tampilkanError('Terjadi masalah koneksi. Coba lagi.')
    } finally {
      tombolLogin.disabled = false
      tombolLogin.textContent = 'Login'
    }
  }

  tombolLogin.addEventListener('click', login)
  inputPassword.addEventListener('keydown', e => { if (e.key === 'Enter') login() })
  inputIdentitas.addEventListener('keydown', e => { if (e.key === 'Enter') inputPassword.focus() })
</script>

</body>
</html>
